name: React Release Deployment

on:
  push:
    branches: [development]
    # Trigger for any push; further filter using commit message condition in job

jobs:
  deploy:
    if: contains(github.event.head_commit.message, 'RELEASE')
    runs-on: self-hosted
    steps:
      - name: Checkout repository (optional, ensures actions have repo context)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Deploy to remote server via SSH
        run: |
          # Create .ssh directory and save the private key
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/release_key
          chmod 600 ~/.ssh/release_key
          
          # Execute commands on remote server
          ssh -i ~/.ssh/release_key -o StrictHostKeyChecking=no ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} << 'EOF'
            set -e
            REPO_DIR=~/ostad-app
            
            # Clone if the repository does not exist, otherwise pull latest
            if [ -d "$REPO_DIR/.git" ]; then
              echo "Repository exists – pulling latest changes"
              cd $REPO_DIR
              git fetch origin
              git checkout development
              git pull origin development
            else
              echo "Cloning repository"
              git clone https://github.com/${{ github.repository }} $REPO_DIR
              cd $REPO_DIR
            fi

            echo "Installing Node dependencies"
            npm ci

            echo "Building the React app"
            npm run build

            echo "Ensuring Nginx is installed"
            if ! command -v nginx >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y nginx
            fi

            echo "Deploying build artifacts to /var/www/html"
            sudo rm -rf /var/www/html/*
            sudo cp -r dist/* /var/www/html/

            # Create a basic Nginx site config if it doesn't exist
            if [ ! -f /etc/nginx/sites-available/ostad ]; then
              echo "Creating Nginx site configuration"
              printf "server {
    listen 80 default_server;
    server_name _;
    root /var/www/html;
    index index.html;
    location / {
        try_files \$uri \$uri/ /index.html;
    }
}\n" | sudo tee /etc/nginx/sites-available/ostad > /dev/null
              sudo ln -s /etc/nginx/sites-available/ostad /etc/nginx/sites-enabled/ostad
            fi

            echo "Testing Nginx configuration and reloading"
            sudo nginx -t && sudo systemctl restart nginx
          EOF

          # Clean up the private key
          rm ~/.ssh/release_key
